# The bind-mounted data directory must be writable by uid 1001 (the image's `nextjs` user), otherwise the
# worker dies with SQLITE_CANTOPEN while the web container keeps serving:
#   sudo mkdir -p /srv/storage/supaaction/data && sudo chown 1001:1001 /srv/storage/supaaction/data
services:
  supaaction:
    build:
      network: host
    ports: !override
      - "${SUPAACTION_BIND_ADDRESS:-192.168.0.250}:${SUPAACTION_PORT:-3200}:3000"
    volumes: !override
      - "${SUPAACTION_DATA_PATH:-/srv/storage/supaaction/data}:/data"
    dns:
      - 1.1.1.1
      - 1.0.0.1

  supaaction-worker:
    volumes: !override
      - "${SUPAACTION_DATA_PATH:-/srv/storage/supaaction/data}:/data"
    dns:
      - 1.1.1.1
      - 1.0.0.1
