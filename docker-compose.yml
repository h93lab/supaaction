services:
  supaaction:
    image: supaaction:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supaaction
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCHEDULER_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - supaaction-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  supaaction-worker:
    image: supaaction:local
    pull_policy: never
    container_name: supaaction-worker
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env
    volumes:
      - supaaction-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true

volumes:
  supaaction-data:
    name: supaaction-data
